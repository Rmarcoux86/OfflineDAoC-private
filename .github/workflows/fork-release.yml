# Builds this fork's server and publishes a small "fork update" zip that players drop onto a stock 0.37 game.
# Runs when a tag like fork-v1 is pushed, or by hand from the Actions tab (Run workflow).
name: Fork release

on:
  push:
    tags: ["fork-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release name, e.g. fork-v1"
        required: true
      notes:
        description: "What's new, one item per line (player-facing). Empty: the commit titles since the last fork release."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history and tags, so the release notes can list the commits since the last fork release.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Prepare server config
        shell: pwsh
        run: Copy-Item source/server/CoreServer/config/serverconfig.example.xml source/server/CoreServer/config/serverconfig.xml

      - name: Build server
        shell: pwsh
        run: dotnet build "source/server/Dawn of Light.sln" -c Release

      - name: Run the fork's tests
        shell: pwsh
        run: dotnet test source/server/Tests/Tests.csproj -c Release --no-build --filter "FullyQualifiedName~UT_Fishing|FullyQualifiedName~UT_Expedition" --logger "trx;LogFileName=fork-tests.trx" --results-directory test-results

      # The launcher ships in the update too (launcher\ in the zip), so players get its changes and the GET UPDATE button.
      - name: Build launcher
        shell: pwsh
        run: dotnet build source/tools/OfflineDaoc.Launcher/OfflineDaoc.Launcher.csproj -c Release

      - name: Run the launcher's tests
        shell: pwsh
        run: dotnet test source/tools/OfflineDaoc.Launcher.Tests/OfflineDaoc.Launcher.Tests.csproj -c Release --logger "trx;LogFileName=launcher-tests.trx" --results-directory test-results

      # Turn every failed test into an annotation, so failures are readable on the run page and through the API.
      - name: Report failed tests
        if: always()
        shell: pwsh
        run: |
          $trxFiles = @(Get-ChildItem test-results -Filter *.trx -Recurse -ErrorAction SilentlyContinue)
          if ($trxFiles.Count -eq 0)
          {
              Write-Output "::error title=No test results::dotnet test produced no TRX file (build or discovery failed before running tests)."
              exit 0
          }

          $ns = @{ t = 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010' }
          foreach ($trx in $trxFiles)
          {
              [xml]$doc = Get-Content $trx.FullName
              $counters = Select-Xml -Xml $doc -XPath '//t:Counters' -Namespace $ns | Select-Object -First 1
              Write-Output "::notice title=Test totals ($($trx.BaseName))::total=$($counters.Node.total) passed=$($counters.Node.passed) failed=$($counters.Node.failed)"

              foreach ($r in (Select-Xml -Xml $doc -XPath "//t:UnitTestResult[@outcome='Failed']" -Namespace $ns))
              {
                  $msg = ($r.Node.Output.ErrorInfo.Message -replace "`r?`n", ' | ')
                  if ($msg.Length -gt 900)
                  {
                      $msg = $msg.Substring(0, 900)
                  }

                  Write-Output "::error title=$($r.Node.testName)::$msg"
              }
          }

      - name: Assemble the update zip
        shell: pwsh
        run: |
          $name = if ('${{ github.event.inputs.version }}') { '${{ github.event.inputs.version }}' } else { '${{ github.ref_name }}' }
          $out = "fork-update-$name"
          New-Item -ItemType Directory $out | Out-Null
          Copy-Item source/server/Release/lib/GameServer.dll, source/server/Release/lib/GameServer.pdb $out
          Copy-Item "fork-release/INSTALL FORK UPDATE.cmd", "fork-release/RESTORE STOCK SERVER.cmd", "fork-release/README-FORK.txt" $out
          Copy-Item "QUICK COMMANDS.txt", "ALL SERVER COMMANDS.txt" $out
          # The build history the launcher shows (BUILD HISTORY); the installer copies it to runtime\build-history.json.
          Copy-Item "fork-release/build-history.json" $out
          # The Gauntlet spectators players submitted (hall-of-fame workflow); the installer copies it to
          # runtime\server\gauntlet-spectators.json, where the server reads it at start (GauntletSpectators.cs).
          Copy-Item "gauntlet/guest-champions.json" "$out/gauntlet-spectators.json"

          # The launcher build: only its own five files. System.Data.SQLite and its native interop are already in every
          # 0.37 runtime folder (and new-client\runtime) from the same package version.
          $launcherBuild = "source/tools/OfflineDaoc.Launcher/bin/Release/net10.0-windows"
          New-Item -ItemType Directory "$out/launcher" | Out-Null
          foreach ($file in "OfflineDAoC.exe", "OfflineDAoC.dll", "OfflineDAoC.pdb", "OfflineDAoC.deps.json", "OfflineDAoC.runtimeconfig.json")
          {
              Copy-Item (Join-Path $launcherBuild $file) "$out/launcher" -ErrorAction Stop
          }

          # The installer copies this to runtime\fork-version.txt; the launcher compares it with the latest release's tag.
          Set-Content -Path "$out/fork-version.txt" -Value $name -Encoding ascii
          Compress-Archive -Path "$out/*" -DestinationPath "$out.zip"
          "ZIP=$out.zip" | Out-File -Append $env:GITHUB_ENV
          "NAME=$name" | Out-File -Append $env:GITHUB_ENV

      # The release description: "## What's new" (this build's entry in fork-release/build-history.json, else the notes
      # input, else the commit titles since the last fork release),
      # then the install steps. The launcher reads the "What's new" section for its update notes and build history.
      - name: Release notes
        shell: pwsh
        env:
          NOTES: ${{ github.event.inputs.notes }}
        run: |
          $items = @()
          $history = @()
          try { $history = @(Get-Content fork-release/build-history.json -Raw | ConvertFrom-Json) } catch { }
          $entry = $history | Where-Object { $_.tag -eq $env:NAME } | Select-Object -First 1
          if ($entry) {
            $items = @($entry.items | ForEach-Object { "- $_" })
          } elseif ($env:NOTES -and $env:NOTES.Trim()) {
            $items = $env:NOTES -split "`r?`n" | Where-Object { $_.Trim() } | ForEach-Object { $t = $_.Trim(); if ($t.StartsWith("- ")) { $t } else { "- $t" } }
          } else {
            $previous = git tag --list "fork-v*" --sort=-version:refname | Where-Object { $_ -ne $env:NAME } | Select-Object -First 1
            $range = if ($previous) { "$previous..HEAD" } else { "HEAD~20..HEAD" }
            $items = git log $range --no-merges --pretty=format:"- %s" | Where-Object { $_ -notmatch "^- (Changelog|Restore CRLF|Fix .*initializer)" }
          }
          if (-not $items) { $items = @("- Maintenance build.") }
          $install = @'
          Fork update for Offline DAoC 0.37: fishing and Expedition mode.

          1. Install the stock game from the v0.37 release of shadowofze/OfflineDAoC if you don't have it.
          2. Download the zip below, extract it anywhere, close the game and stop the server.
          3. Double-click `INSTALL FORK UPDATE.cmd` and point it at your `playable-v0.37` folder.
          4. Start the game. `/fish pole` to fish, `/run new` on a fresh level-1 character for Expedition mode.

          Already have an earlier fork update? The launcher shows **GET UPDATE** instead of START SERVER; click it and it installs this one and restarts.

          `RESTORE STOCK SERVER.cmd` puts the original server back. Your saves are never changed.
          '@
          $body = @("## What's new") + $items + @("", "## How to install", $install)
          Set-Content -Path release-notes.md -Value ($body -join "`n") -Encoding utf8

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.NAME }}
          name: ${{ env.NAME }}
          files: ${{ env.ZIP }}
          body_path: release-notes.md

